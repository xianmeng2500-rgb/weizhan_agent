# Nginx 配置 - 微站系统

# IP 全局限流兜底: 每 IP 每秒 5 次, 突发最多 20, 超出返回 429
# (应用层已有按接口分级的更细限流, 这里是防绕过应用层的最后一道闸)
limit_req_zone $binary_remote_addr zone=weizhan_zone:10m rate=5r/s;
limit_req_status 429;

upstream weizhan_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.com;

    # API 接口
    location /api/ {
        proxy_pass http://weizhan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        limit_req zone=weizhan_zone burst=20 nodelay;
    }

    # 公开接口(H5访问)
    location /p/ {
        proxy_pass http://weizhan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=weizhan_zone burst=20 nodelay;
    }

    # 静态文件(本地上传)
    location /static/ {
        proxy_pass http://weizhan_backend;
    }

    # 后台管理前端
    location ^~ /admin/ {
        alias /app/admin-frontend/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # H5微站前端
    location / {
        alias /app/h5-frontend/dist/;
        try_files $uri $uri/ /index.html;
    }
}
