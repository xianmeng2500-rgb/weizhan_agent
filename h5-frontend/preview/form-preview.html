<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H5 报名表单 · 新视觉预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    background: #eef0f4;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .page-header { text-align: center; margin-bottom: 20px; }
  .page-header h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 6px; }
  .page-header p { font-size: 13px; color: #909399; }

  /* 主题切换 */
  .theme-switcher {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .theme-btn {
    padding: 8px 18px; border-radius: 20px; border: 2px solid #d9dce3; background: #fff;
    font-size: 13px; cursor: pointer; color: #606266; transition: all .2s;
  }
  .theme-btn.active { border-color: transparent; color: #fff; }
  .theme-btn.t-classic.active { background: linear-gradient(135deg,#667eea,#764ba2); }
  .theme-btn.t-dark.active { background: linear-gradient(135deg,#1a1a2e,#2e5f6b); }
  .theme-btn.t-festive.active { background: linear-gradient(135deg,#c0392b,#e74c3c); }

  /* 手机框 */
  .phone-wrap { display: flex; justify-content: center; }
  .phone {
    width: 375px; background: #f5f6fa; border-radius: 32px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.15); border: 8px solid #1a1a2e; position: relative;
  }
  .phone-status {
    height: 34px; background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #969799; border-bottom: 1px solid #f0f0f0;
  }
  .nav-bar {
    height: 46px; background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #323233; position: relative;
    border-bottom: 1px solid #f5f5f5;
  }
  .nav-bar .back { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #323233; font-size: 18px; }
  .phone-body { height: 720px; overflow-y: auto; }

  /* ===== 主题变量 ===== */
  .form-page { --fp: #667eea; --fp2: #764ba2; --fpl: rgba(102,126,234,.1); --fps: #eef1fd; --fg: linear-gradient(135deg,#667eea,#764ba2); }
  .form-page.tpl-dark { --fp: #5dcaa5; --fp2: #2e9c8f; --fpl: rgba(93,202,165,.12); --fps: #e6f7f1; --fg: linear-gradient(135deg,#1a1a2e,#2e5f6b); }
  .form-page.tpl-festive { --fp: #e74c3c; --fp2: #c0392b; --fpl: rgba(231,76,60,.1); --fps: #fdeeee; --fg: linear-gradient(135deg,#c0392b,#e74c3c); }

  .form-body { padding: 12px 12px 24px; }

  /* 头部 */
  .form-header {
    position: relative; overflow: hidden; background: var(--fg); border-radius: 16px;
    padding: 28px 20px; margin-bottom: 12px; color: #fff; text-align: center;
  }
  .decor { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
  .d1 { width: 160px; height: 160px; top: -60px; right: -40px; }
  .d2 { width: 90px; height: 90px; bottom: -30px; left: -20px; }
  .d3 { width: 50px; height: 50px; top: 20px; left: 12%; background: rgba(255,255,255,.12); }
  .form-header-content { position: relative; z-index: 1; }
  .form-icon-wrap {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
    background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .form-title { font-size: 21px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .form-desc { margin: 10px auto 0; max-width: 90%; font-size: 13px; line-height: 1.6; opacity: .92; }

  /* 字段卡片 */
  .field-card {
    background: #fff; border-radius: 14px; padding: 16px 16px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04); margin-bottom: 12px;
  }
  .field-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 0 2px; }
  .field-icon {
    width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--fp); background: var(--fps); font-size: 13px;
  }
  .field-label { font-size: 15px; font-weight: 600; color: #323233; }
  .req { color: #ee0a24; font-size: 14px; margin-left: 2px; }

  /* 输入框模拟 */
  .field-input {
    padding: 10px 2px; font-size: 15px; color: #323233; border: none; outline: none;
    width: 100%; background: transparent; font-family: inherit;
  }
  .field-input::placeholder { color: #c0c4cc; }
  .input-row { display: flex; align-items: center; justify-content: space-between; }
  .input-row .arrow { color: #c0c4cc; font-size: 14px; }

  /* 选项 */
  .option-list { display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 10px; }
  .option-item {
    display: flex; align-items: center; justify-content: space-between; padding: 13px 14px;
    border-radius: 10px; border: 1.5px solid #ebeef5; background: #fafbfc; transition: all .2s;
  }
  .option-item.active { border-color: var(--fp); background: var(--fpl); }
  .option-text { font-size: 15px; color: #323233; }
  .o-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #dcdee0; display: flex; align-items: center; justify-content: center; }
  .o-radio.checked { border-color: var(--fp); }
  .o-radio .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--fp); }
  .o-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #dcdee0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
  .o-check.checked { background: var(--fp); border-color: var(--fp); }

  /* 提示文本 */
  .form-tip {
    display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.6; margin-bottom: 12px;
  }
  .form-tip.info { color: #337ecc; background: #ecf5ff; }

  /* 交通 */
  .transport-section { background: #f7f8fa; border-radius: 10px; padding: 4px 12px 0; margin-bottom: 10px; }
  .transport-section-title { font-size: 13px; font-weight: 600; color: #646566; padding: 10px 0 0; display: flex; align-items: center; gap: 5px; }
  .transport-section-title i { color: var(--fp); font-style: normal; }

  /* 图片上传模拟 */
  .uploader { display: flex; gap: 10px; padding: 6px 2px 10px; }
  .upload-box {
    width: 80px; height: 80px; border-radius: 10px; border: 1.5px dashed var(--fp);
    background: var(--fps); display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--fp); font-size: 20px;
  }
  .upload-box span { font-size: 10px; margin-top: 3px; color: var(--fp); opacity: .8; }

  /* 提交按钮 */
  .submit-area { margin-top: 24px; padding: 0 4px; }
  .submit-btn {
    height: 48px; border-radius: 24px; background: var(--fg); color: #fff;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; border: none; width: 100%;
    box-shadow: 0 6px 16px var(--fpl); cursor: pointer;
  }
  .submit-tip { text-align: center; color: #c0c4cc; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="page-header">
    <h1>H5 报名表单 · 视觉预览</h1>
    <p>自动继承微站主题（经典 / 暗黑 / 节日），点下方按钮切换主题</p>
  </div>

  <div class="theme-switcher">
    <button class="theme-btn t-classic active" onclick="switchTheme('classic', this)">经典（紫蓝）</button>
    <button class="theme-btn t-dark" onclick="switchTheme('dark', this)">暗黑（青绿）</button>
    <button class="theme-btn t-festive" onclick="switchTheme('festive', this)">节日（红金）</button>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-status">9:41</div>
      <div class="nav-bar"><span class="back">‹</span>活动报名</div>
      <div class="phone-body">
        <div class="form-page tpl-classic" id="formPage">
          <div class="form-body">
            <!-- 表单头部 -->
            <div class="form-header">
              <div class="decor d1"></div>
              <div class="decor d2"></div>
              <div class="decor d3"></div>
              <div class="form-header-content">
                <div class="form-icon-wrap">📝</div>
                <h2 class="form-title">2026 年行业峰会报名</h2>
                <p class="form-desc">请如实填写以下报名信息，组委会将根据信息安排参会席位与住宿。</p>
              </div>
            </div>

            <!-- 提示文本 -->
            <div class="form-tip info">ℹ️&nbsp; 带 * 号为必填项，请完整填写</div>

            <!-- 单行文本 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">✏️</span><span class="field-label">姓名</span><span class="req">*</span>
              </div>
              <input class="field-input" placeholder="请输入姓名" value="张三">
            </div>

            <!-- 手机号 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">📱</span><span class="field-label">手机号</span><span class="req">*</span>
              </div>
              <input class="field-input" placeholder="请输入手机号" value="138****8000">
            </div>

            <!-- 多行文本 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">📝</span><span class="field-label">参会期望</span>
              </div>
              <input class="field-input" placeholder="简单描述您的参会期望">
            </div>

            <!-- 单选 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">◉</span><span class="field-label">用餐偏好</span><span class="req">*</span>
              </div>
              <div class="option-list">
                <div class="option-item active"><span class="option-text">中餐</span><span class="o-radio checked"><span class="dot"></span></span></div>
                <div class="option-item"><span class="option-text">西餐</span><span class="o-radio"></span></div>
                <div class="option-item"><span class="option-text">清真</span><span class="o-radio"></span></div>
              </div>
            </div>

            <!-- 多选 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">✓</span><span class="field-label">感兴趣的议题</span>
              </div>
              <div class="option-list">
                <div class="option-item active"><span class="option-text">AI 与产业变革</span><span class="o-check checked">✓</span></div>
                <div class="option-item active"><span class="option-text">数字化营销</span><span class="o-check checked">✓</span></div>
                <div class="option-item"><span class="option-text">组织与人才</span><span class="o-check"></span></div>
              </div>
            </div>

            <!-- 下拉选择 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">☰</span><span class="field-label">参会城市</span><span class="req">*</span>
              </div>
              <div class="input-row">
                <input class="field-input" placeholder="请选择城市" value="上海市">
                <span class="arrow">›</span>
              </div>
            </div>

            <!-- 交通信息 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">🚌</span><span class="field-label">交通信息</span><span class="req">*</span>
              </div>
              <div class="transport-section">
                <div class="transport-section-title"><i>🚚</i>去程信息</div>
                <input class="field-input" placeholder="选择去程方式" value="高铁">
                <input class="field-input" placeholder="航班/车次号">
              </div>
              <div class="transport-section">
                <div class="transport-section-title"><i>🚚</i>回程信息</div>
                <input class="field-input" placeholder="选择回程方式">
                <input class="field-input" placeholder="航班/车次号">
              </div>
            </div>

            <!-- 图片上传 -->
            <div class="field-card">
              <div class="field-header">
                <span class="field-icon">🖼️</span><span class="field-label">证件照片</span><span class="req">*</span>
              </div>
              <div class="uploader">
                <div class="upload-box">＋<span>上传</span></div>
                <div class="upload-box">＋<span>上传</span></div>
              </div>
            </div>

            <!-- 提交按钮 -->
            <div class="submit-area">
              <button class="submit-btn">提交报名</button>
              <p class="submit-tip">请确认信息无误后提交</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
function switchTheme(name, btn) {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const page = document.getElementById('formPage');
  page.className = 'form-page tpl-' + name;
}
</script>
</body>
</html>
